# vsr-frontend — un singur origin pentru browser: static + /media + /api.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── UI-ul React (SPA — orice rută necunoscută → index.html) ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API-ul (JSON + media transcodat) → containerul vsr-api ─────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;      # trim/transcode pot dura
        client_max_body_size 10m;
    }

    # ── Media direct de pe volumul de date (read-only) ─────────────────────
    # nginx servește mp4/wav cu Accept-Ranges nativ — zero bytes prin API.
    # (UI-ul actual cheamă /api/media/… — ruta de mai jos e pentru accesul
    # direct viitor: /media/{video_id}/{face_crop|mouth_crop|audio}/{fișier})
    location /media/ {
        alias /data/processed/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600";
    }

    # ── Autentificare opțională (dincolo de LAN/Tailscale) ─────────────────
    # 1. generezi fișierul:  htpasswd -c docker/htpasswd <utilizator>
    # 2. montezi în compose:  ./docker/htpasswd:/etc/nginx/htpasswd:ro
    # 3. decomentezi în server {}:
    #    auth_basic           "VSR";
    #    auth_basic_user_file /etc/nginx/htpasswd;
}
